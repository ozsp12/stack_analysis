name: Inspect workbook

on:
  push:
    branches:
      - agent/simplify-repository

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - name: Inspect workbook structure and charts
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path('stack_exchange_analysis/analysis/cumulative-answers-questions-stackexchange.xlsx')
          wb = load_workbook(path, data_only=False)
          print('WORKBOOK', path)
          print('SHEETS', wb.sheetnames)
          for ws in wb.worksheets:
              print(f'\nSHEET {ws.title} rows={ws.max_row} cols={ws.max_column}')
              for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 12), values_only=True):
                  print('ROW', row)
              if ws.max_row > 12:
                  print('LAST_ROWS')
                  for row in ws.iter_rows(min_row=max(1, ws.max_row-4), max_row=ws.max_row, values_only=True):
                      print('ROW', row)
              print('CHARTS', len(ws._charts))
              for i, chart in enumerate(ws._charts, start=1):
                  print('CHART', i, type(chart).__name__)
                  title = None
                  try:
                      title = chart.title.tx.rich.p[0].r[0].t
                  except Exception:
                      pass
                  print('TITLE', title)
                  print('ANCHOR', getattr(chart, 'anchor', None))
                  for j, ser in enumerate(chart.ser, start=1):
                      print('SERIES', j)
                      print('  TX', getattr(getattr(ser, 'tx', None), 'strRef', None) or getattr(getattr(ser, 'tx', None), 'v', None))
                      cat = getattr(ser, 'cat', None) or getattr(ser, 'xVal', None)
                      val = getattr(ser, 'val', None) or getattr(ser, 'yVal', None)
                      print('  CAT', cat)
                      print('  VAL', val)
          PY
