name: Render Notebook HTML

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute notebook
        run: |
          mkdir -p rendered
          jupyter nbconvert \
            --to notebook \
            --execute descriptive_analysis.ipynb \
            --ExecutePreprocessor.timeout=600 \
            --output rendered/descriptive_analysis_executed.ipynb

      - name: Render HTML
        run: |
          jupyter nbconvert \
            --to html \
            rendered/descriptive_analysis_executed.ipynb \
            --output descriptive_analysis_executed.html

      - uses: actions/upload-artifact@v4
        with:
          name: descriptive-analysis-html
          path: |
            rendered/descriptive_analysis_executed.ipynb
            rendered/descriptive_analysis_executed.html
