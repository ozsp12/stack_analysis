name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check analysis classes
        run: python -m compileall -q analysis_scripts

      - name: Execute descriptive analysis notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/descriptive_analysis.ipynb \
            --ExecutePreprocessor.timeout=600 \
            --output /tmp/descriptive_analysis.ipynb
