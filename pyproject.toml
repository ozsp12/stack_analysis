[project]
name = "stack-analysis"
version = "0.1.0"
description = "Investigative data analysis of Stack Overflow and Stack Exchange activity."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["stack_exchange_analysis/src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
