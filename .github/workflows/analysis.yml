name: Analysis Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stack_exchange_analysis/notebooks/**"
      - "stack_exchange_analysis/src/**"
      - "stack_exchange_analysis/database/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/analysis.yml"

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Execute and render investigative notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source data before execution
        run: python scripts/check_source_data.py

      - name: Execute notebooks
        run: |
          mkdir -p build/executed build/html
          for notebook in stack_exchange_analysis/notebooks/[0-7]*.ipynb; do
            echo "Executing ${notebook}"
            jupyter nbconvert \
              --to notebook \
              --execute "${notebook}" \
              --ExecutePreprocessor.timeout=900 \
              --output "$(basename "${notebook}")" \
              --output-dir build/executed
          done

      - name: Render executed notebooks as HTML
        run: |
          for notebook in build/executed/*.ipynb; do
            jupyter nbconvert \
              --to html "${notebook}" \
              --output-dir build/html
          done

      - name: Upload rendered analysis
        uses: actions/upload-artifact@v4
        with:
          name: investigative-analysis-${{ github.sha }}
          path: |
            build/executed/*.ipynb
            build/html/*.html
          if-no-files-found: error
          retention-days: 30
